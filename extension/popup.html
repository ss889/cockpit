<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JobOps AI</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header>
        <span class="eyebrow">LOCAL CAREER WORKSPACE</span>
        <h1>JobOps AI</h1>
        <p id="status" role="status">Ready to capture this page.</p>
      </header>

      <section class="capture-card" aria-labelledby="capture-heading">
        <span class="card-label">CURRENT TAB</span>
        <h2 id="capture-heading">Import the active job page</h2>
        <p>Capture the visible page text and send it to your local workspace.</p>
        <button id="import-button" type="button">Import Job</button>
        <button id="open-button" class="secondary hidden" type="button">Open in JobOps</button>
      </section>

      <details>
        <summary>Connection settings</summary>
        <label>
          Local app URL
          <input id="agent-url" type="url" placeholder="http://127.0.0.1:3000">
        </label>
        <label>
          Local token
          <input id="local-token" type="password" autocomplete="off" placeholder="JOBOPS_LOCAL_TOKEN">
        </label>
        <button id="save-button" class="secondary" type="button">Save settings</button>
      </details>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
